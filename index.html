<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Closet | Curated Outfits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          borderRadius: { '4xl': '2rem', '5xl': '2.5rem' }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg-color: #d7e8cb;
      --card-bg: #ffffff;
      --text-main: #14171a;
      --text-muted: #657786;
      --pill-bg: #c5dcba;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      transition: background 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .editable-focus {
      outline: 2px dashed rgba(34, 197, 94, 0.7);
      outline-offset: 3px;
      border-radius: 6px;
    }
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }
    .dock-shadow {
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.2), 0 0 15px rgba(0, 0, 0, 0.05);
    }
    .target-highlight {
      animation: pulseHighlight 2.5s ease-out;
    }
    @keyframes pulseHighlight {
      0% { transform: scale(1.02); box-shadow: 0 0 0 4px #16a34a; }
      70% { transform: scale(1.01); box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.4); }
      100% { transform: scale(1); box-shadow: none; }
    }
  </style>
</head>
<body class="p-4 sm:p-6 pb-28 relative flex flex-col items-center">

  <div id="custom-bg-layer" class="fixed inset-0 pointer-events-none z-0 bg-cover bg-center transition-opacity duration-300 opacity-0"></div>

  <main class="w-full max-w-[440px] mx-auto relative z-10 flex flex-col items-center">

    <!-- Profile Header -->
    <header class="w-full flex flex-col items-center text-center mt-3 mb-6 relative">
      <div class="relative group">
        <img id="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" 
             alt="Profile" 
             class="w-24 h-24 rounded-full object-cover shadow-sm border-2 border-white/60 cursor-pointer select-none">
        <button id="btn-change-avatar" class="hidden absolute bottom-0 right-0 bg-black text-white p-2 rounded-full shadow-md text-xs hover:bg-neutral-800" title="Change Photo">
          📷
        </button>
      </div>

      <h1 id="profile-name" class="text-2xl font-black mt-3 tracking-tight editable-elem" contenteditable="false">RUDRA</h1>
      <p id="profile-handle" class="text-xs font-semibold text-neutral-600 mt-0.5 editable-elem px-2 py-0.5" contenteditable="false">@by_rudra.rajkumar</p>
      <p id="profile-bio" class="text-xs text-neutral-700 mt-1 max-w-[320px] editable-elem" contenteditable="false">Outfits and fashion finds from my reels. Tap to shop!</p>

      <nav class="flex items-center p-1 rounded-full mt-5 card-shadow" style="background-color: var(--pill-bg);" aria-label="Sections">
        <button id="tab-links" class="px-7 py-2 rounded-full text-xs font-bold transition-all text-neutral-600 hover:text-neutral-900">Links</button>
        <button id="tab-shop" class="px-7 py-2 rounded-full text-xs font-bold transition-all bg-white text-neutral-900 shadow-sm">Shop</button>
      </nav>
    </header>

    <!-- Views -->
    <div class="w-full">

      <!-- Links View -->
      <section id="view-links" class="w-full hidden space-y-3">
        <div id="links-container" class="space-y-3 w-full"></div>
        <button id="btn-add-link" class="hidden w-full py-3.5 rounded-3xl border-2 border-dashed border-neutral-400 font-bold text-xs text-neutral-700 hover:bg-white/40">
          + Add New Bio Link
        </button>
      </section>

      <!-- Shop Main View (Folders) -->
      <section id="view-shop-folders" class="w-full space-y-4">
        <div id="folders-container" class="space-y-4 w-full"></div>
      </section>

      <!-- Shop Subpage View (Inside Folder) -->
      <section id="view-folder-detail" class="w-full hidden">
        <div class="w-full flex items-center justify-between mb-4 px-1">
          <button id="btn-back-folders" class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-white/80 hover:bg-white text-xs font-bold shadow-sm transition">
            ← <span>Back to All Collections</span>
          </button>
          <div class="flex items-center gap-2">
            <button id="btn-copy-current-folder" class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-white/80 hover:bg-white text-xs font-semibold shadow-sm transition" title="Copy link to this collection">
              🔗 <span>Share Folder</span>
            </button>
            <span id="detail-folder-count" class="text-[11px] font-bold uppercase tracking-wider text-neutral-600">4 Products</span>
          </div>
        </div>

        <div class="w-full bg-white/70 backdrop-blur-md rounded-3xl p-4 shadow-sm mb-5 flex items-center justify-between gap-3">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-xl">📁</span>
            <h2 id="detail-folder-title" class="text-base font-extrabold truncate editable-elem" contenteditable="false">Collection Name</h2>
          </div>
        </div>

        <div id="folder-products-grid" class="grid grid-cols-2 gap-3.5 w-full"></div>

        <button id="btn-add-product" class="hidden w-full mt-4 py-3.5 rounded-3xl border-2 border-dashed border-neutral-400 font-bold text-xs text-neutral-700 hover:bg-white/40">
          + Add Item to this Collection
        </button>
      </section>

    </div>

    <!-- Disclosure -->
    <footer class="mt-12 text-center text-[10px] text-neutral-500 max-w-[320px] leading-relaxed">
      <p id="affiliate-disclosure" class="editable-elem" contenteditable="false">As an associate I earn from qualifying purchases. Links above are affiliate links at no extra cost to you.</p>
    </footer>

  </main>

  <!-- Admin Bar -->
  <div id="admin-bar" class="hidden fixed bottom-4 inset-x-4 max-w-[460px] mx-auto bg-white/95 backdrop-blur-md rounded-3xl dock-shadow p-3 z-50 border border-neutral-200">
    <div class="flex items-center justify-between pb-2 mb-2 border-b border-neutral-100 text-[11px] font-bold text-neutral-700">
      <span class="flex items-center gap-1.5 text-green-700">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        ADMIN ACTIVE
      </span>
      <div class="flex items-center gap-1.5">
        <button id="btn-dock-publish" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-full shadow-sm flex items-center gap-1 transition">
          ☁️ <span id="publish-text">Publish Live</span>
        </button>
        <button id="btn-dock-lock" class="bg-neutral-100 hover:bg-neutral-200 text-neutral-700 px-2.5 py-1 rounded-full transition">
          🔒 Lock
        </button>
      </div>
    </div>
    
    <div class="grid grid-cols-6 gap-1.5 text-[10px] font-bold text-neutral-700 text-center">
      <button id="btn-dock-folder" class="p-2 rounded-xl bg-neutral-50 hover:bg-neutral-100 flex flex-col items-center">
        📁<span>+ Folder</span>
      </button>
      <button id="btn-dock-product" class="p-2 rounded-xl bg-neutral-50 hover:bg-neutral-100 flex flex-col items-center">
        🏷️<span>+ Item</span>
      </button>
      <button id="btn-dock-theme" class="p-2 rounded-xl bg-neutral-50 hover:bg-neutral-100 flex flex-col items-center">
        🎨<span>Theme</span>
      </button>
      <button id="btn-dock-github" class="p-2 rounded-xl bg-neutral-50 hover:bg-neutral-100 flex flex-col items-center">
        ⚙️<span>GitHub</span>
      </button>
      <button id="btn-dock-pin" class="p-2 rounded-xl bg-neutral-50 hover:bg-neutral-100 flex flex-col items-center">
        🔑<span>PIN</span>
      </button>
      <button id="btn-dock-export" class="p-2 rounded-xl bg-neutral-50 hover:bg-neutral-100 flex flex-col items-center">
        💾<span>Export</span>
      </button>
    </div>
  </div>

  <input type="file" id="generic-file-input" accept="image/*" class="hidden">

  <!-- Theme Modal -->
  <dialog id="theme-modal" class="rounded-3xl p-5 max-w-[380px] w-full backdrop:bg-black/40 card-shadow border-0">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-extrabold text-sm">Customize Theme</h3>
      <button onclick="document.getElementById('theme-modal').close()" class="text-neutral-400 hover:text-black font-bold">✕</button>
    </div>
    <div class="space-y-4 text-xs">
      <div>
        <label class="font-bold text-neutral-600 block mb-2">Preset Colors</label>
        <div class="grid grid-cols-4 gap-2 text-[11px] text-center font-semibold">
          <button onclick="setThemePreset('#d7e8cb', '#c5dcba')" class="p-2 rounded-xl border" style="background:#d7e8cb;">Sage</button>
          <button onclick="setThemePreset('#e8dcf7', '#dac7f3')" class="p-2 rounded-xl border" style="background:#e8dcf7;">Lavender</button>
          <button onclick="setThemePreset('#f4efe6', '#e5dcce')" class="p-2 rounded-xl border" style="background:#f4efe6;">Oat</button>
          <button onclick="setThemePreset('#fed7aa', '#fdba74')" class="p-2 rounded-xl border" style="background:#fed7aa;">Peach</button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- GitHub Modal -->
  <dialog id="github-modal" class="rounded-3xl p-5 max-w-[380px] w-full backdrop:bg-black/40 card-shadow border-0">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-extrabold text-sm">GitHub 1-Click Sync</h3>
      <button onclick="document.getElementById('github-modal').close()" class="text-neutral-400 hover:text-black font-bold">✕</button>
    </div>
    <form id="github-form" class="space-y-2.5 text-xs">
      <div>
        <label class="font-bold text-neutral-600 block mb-0.5">GitHub Username</label>
        <input id="gh-user" type="text" class="w-full p-2.5 rounded-xl border bg-neutral-50" placeholder="rudrarajkumar" required>
      </div>
      <div>
        <label class="font-bold text-neutral-600 block mb-0.5">Repository Name</label>
        <input id="gh-repo" type="text" class="w-full p-2.5 rounded-xl border bg-neutral-50" placeholder="closet" required>
      </div>
      <div>
        <label class="font-bold text-neutral-600 block mb-0.5">Branch</label>
        <input id="gh-branch" type="text" class="w-full p-2.5 rounded-xl border bg-neutral-50" value="main" required>
      </div>
      <div>
        <label class="font-bold text-neutral-600 block mb-0.5">File Path</label>
        <input id="gh-path" type="text" class="w-full p-2.5 rounded-xl border bg-neutral-50" value="index.html" required>
      </div>
      <div>
        <label class="font-bold text-neutral-600 block mb-0.5">Personal Access Token (classic)</label>
        <input id="gh-token" type="password" class="w-full p-2.5 rounded-xl border bg-neutral-50 font-mono text-[11px]" placeholder="ghp_..." required>
      </div>
      <button type="submit" class="w-full py-2.5 bg-black text-white font-bold rounded-xl mt-2 hover:bg-neutral-800">
        Save GitHub Settings
      </button>
    </form>
  </dialog>

  <!-- Toast -->
  <div id="toast" class="fixed top-5 z-50 bg-black/85 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg transition-all transform -translate-y-16 pointer-events-none opacity-0">
    Link copied!
  </div>

  <script>
    const STORAGE_KEY = 'closet_data_store_v3';
    const GITHUB_KEY = 'closet_gh_config_v1';
    const PIN_KEY = 'closet_admin_pin_v1';

    const defaultData = {
      profile: {
        name: "RUDRA",
        handle: "@by_rudra.rajkumar",
        bio: "Outfits and fashion finds from my reels. Tap to shop!",
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80",
        disclosure: "As an associate I earn from qualifying purchases. Links above are affiliate links at no extra cost to you."
      },
      theme: {
        bgColor: "#d7e8cb",
        pillColor: "#c5dcba",
        wallpaper: "",
        isDark: false
      },
      folders: [
        {
          id: "folder-1",
          title: "Fashion Picks",
          items: [
            {
              id: "item-1-0",
              title: "T-Shirt",
              price: "$24.99",
              url: "https://amazon.com",
              photo: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=400&q=80"
            },
            {
              id: "item-1-1",
              title: "Straight Fit Jeans",
              price: "$48.00",
              url: "https://amazon.com",
              photo: "https://images.unsplash.com/photo-1542272604-780c96856592?auto=format&fit=crop&w=400&q=80"
            },
            {
              id: "item-1-2",
              title: "Retro Sneakers",
              price: "$75.00",
              url: "https://amazon.com",
              photo: "https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&w=400&q=80"
            },
            {
              id: "item-1-3",
              title: "Silver Classic Watch",
              price: "$59.00",
              url: "https://amazon.com",
              photo: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=400&q=80"
            }
          ]
        }
      ],
      links: [
        { title: "Follow on Instagram", url: "https://instagram.com" },
        { title: "YouTube Channel", url: "https://youtube.com" }
      ]
    };

    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultData;
    let isAdmin = false;
    let currentActiveFolderId = null;
    let fileUploadCallback = null;

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.remove('-translate-y-16', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.add('-translate-y-16', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2000);
    }

    function copyDeepLink(hash) {
      const url = `${window.location.origin}${window.location.pathname}${hash}`;
      navigator.clipboard.writeText(url).then(() => {
        showToast('Direct Link Copied!');
      }).catch(() => {
        prompt('Copy this link:', url);
      });
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    function applyTheme() {
      document.documentElement.style.setProperty('--bg-color', appData.theme.bgColor);
      document.documentElement.style.setProperty('--pill-bg', appData.theme.pillColor);
      const bgLayer = document.getElementById('custom-bg-layer');
      if (appData.theme.wallpaper) {
        bgLayer.style.backgroundImage = `url(${appData.theme.wallpaper})`;
        bgLayer.classList.remove('opacity-0');
        bgLayer.classList.add('opacity-100');
      } else {
        bgLayer.style.backgroundImage = 'none';
        bgLayer.classList.add('opacity-0');
      }
    }

    function render() {
      applyTheme();
      document.getElementById('avatar-img').src = appData.profile.avatar;
      document.getElementById('profile-name').innerText = appData.profile.name;
      document.getElementById('profile-handle').innerText = appData.profile.handle;
      document.getElementById('profile-bio').innerText = appData.profile.bio;
      document.getElementById('affiliate-disclosure').innerText = appData.profile.disclosure;

      document.querySelectorAll('.editable-elem').forEach(el => {
        el.contentEditable = isAdmin ? "true" : "false";
        el.classList.toggle('editable-focus', isAdmin);
      });

      document.getElementById('btn-change-avatar').classList.toggle('hidden', !isAdmin);
      document.getElementById('admin-bar').classList.toggle('hidden', !isAdmin);
      document.getElementById('btn-add-product').classList.toggle('hidden', !isAdmin);
      document.getElementById('btn-add-link').classList.toggle('hidden', !isAdmin);

      renderFolders();
      renderLinks();

      if (currentActiveFolderId) {
        renderFolderDetail(currentActiveFolderId);
      }
    }

    function renderFolders() {
      const container = document.getElementById('folders-container');
      container.innerHTML = '';

      appData.folders.forEach(folder => {
        const card = document.createElement('div');
        card.id = folder.id;
        card.className = "w-full bg-white rounded-5xl p-5 card-shadow transition-transform active:scale-[0.99] relative cursor-pointer";

        const previewItems = folder.items.slice(0, 4);
        let previewsHtml = previewItems.length > 0 ? `
          <div class="grid grid-cols-${Math.min(previewItems.length, 4)} gap-2 py-4 px-2 items-center justify-items-center">
            ${previewItems.map(item => `
              <div class="w-16 h-20 sm:w-20 sm:h-24 rounded-2xl bg-neutral-50 flex items-center justify-center overflow-hidden p-1">
                <img src="${item.photo}" class="w-full h-full object-contain mix-blend-multiply" alt="${item.title}">
              </div>
            `).join('')}
          </div>
        ` : `<div class="py-8 text-center text-xs text-neutral-400 font-semibold">Empty Collection</div>`;

        card.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <span class="text-xs text-neutral-400">⠿</span>
            <div class="flex items-center gap-1.5">
              <button onclick="event.stopPropagation(); copyDeepLink('#${folder.id}')" 
                      class="px-2.5 py-1 rounded-full bg-neutral-100 hover:bg-neutral-200 text-[11px] font-semibold text-neutral-700 flex items-center gap-1" 
                      title="Copy link to this folder">
                🔗 <span class="hidden sm:inline">Copy Link</span>
              </button>
              ${isAdmin ? `<button onclick="event.stopPropagation(); deleteFolder('${folder.id}')" class="p-1 text-red-500 hover:text-red-700 text-xs">🗑️</button>` : ''}
              <button class="w-7 h-7 rounded-full bg-neutral-100 flex items-center justify-center text-xs font-bold text-neutral-600">›</button>
            </div>
          </div>
          ${previewsHtml}
          <div class="text-center mt-1">
            <h3 class="text-sm font-extrabold text-neutral-900">${folder.title}</h3>
            <p class="text-[11px] font-bold text-neutral-400">${folder.items.length} Products</p>
          </div>
        `;

        card.addEventListener('click', () => openFolderView(folder.id));
        container.appendChild(card);
      });
    }

    function renderFolderDetail(folderId) {
      const folder = appData.folders.find(f => f.id === folderId);
      if (!folder) return;

      document.getElementById('detail-folder-title').innerText = folder.title;
      document.getElementById('detail-folder-count').innerText = `${folder.items.length} Products`;
      document.getElementById('btn-copy-current-folder').onclick = () => copyDeepLink(`#${folder.id}`);

      const grid = document.getElementById('folder-products-grid');
      grid.innerHTML = '';

      folder.items.forEach((item, index) => {
        const itemCard = document.createElement('div');
        itemCard.id = item.id;
        itemCard.className = "bg-white rounded-3xl p-3 card-shadow flex flex-col justify-between relative transition duration-300";

        itemCard.innerHTML = `
          ${is
